<!DOCTYPE html>
<html>
    <head>
        <title>Exemplo de Formulário</title>
    </head>
    <body>
        <form action="pais">Viagem para:
            <select name="pais" id="pais">
                <option value="brasil">Brasil</option>
                <option value="eua">Estados Unidos</option>
                <option value="portugal">Portugal</option>
            </select><br>
            <label for="mensagem">Descrição da viagem:</label><br>
            <textarea name="mensagem" id="mensagem" rows="4" cols="25"></textarea>
        </form>
    </body>
</html>
